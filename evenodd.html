<!DOCTYPE html>
<html lang="en">

<body>
    
    <script>
    let num = Number(prompt("Enter a number:"));

        if (num % 2 === 0) {
            alert("The number is Even");
        } else {
            alert("The number is Odd");
            }   

    </script>
</body>
</html>
