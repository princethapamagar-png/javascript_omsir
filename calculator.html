
<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
</head>
<body>

    <h1>Simple Grade Calculator</h1>

    <input type="number" id="marks" placeholder="Enter marks">

    <button onclick="calculateGrade()">
        Calculate Grade
    </button>

    <p id="result"></p>

    <script>
        function calculateGrade() {

            let marks = Number(document.getElementById("marks").value);

            let grade;

            if (document.getElementById("marks").value === "") {

                grade = "Please enter marks";

            }
            else if (marks < 0 || marks > 100) {

                grade = "Invalid Marks";

            }
            else if (marks >= 90) {

                grade = "A+";

            }
            else if (marks >= 80) {

                grade = "A";

            }
            else if (marks >= 70) {

                grade = "B";

            }
            else if (marks >= 60) {

                grade = "C";

            }
            else if (marks >= 50) {

                grade = "D";

            }
            else {

                grade = "F";

            }

            document.getElementById("result").innerHTML =
                "Grade: " + grade;

        }
    </script>

</body>
</html>
