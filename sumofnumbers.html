
<!DOCTYPE html>
<html>
<head>
    <title>Sum of Numbers</title>
</head>
<body>

    <h1>Sum of Numbers from 1 to 100</h1>

    <script>
        let i = 1;
        let sum = 0;

        while (i <= 100) {
            sum = sum + i;
            i++;
        }

        document.write("Total Sum = " + sum);
    </script>

</body>
</html>
